# CLC cleanroom CI. This file and rust/clc-rust-cleanroom/.github/workflows/ci.yml
# are identical. GitHub Actions loads the repository-root copy.
# working-directory keeps every cargo and leash step inside the crate.
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  RUSTFLAGS: "-D warnings"

jobs:
  cleanroom:
    name: clc-rust-cleanroom
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust/clc-rust-cleanroom
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Rust 1.99.0
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-16
        with:
          toolchain: "1.99.0"
          components: clippy, rustfmt

      - name: Check
        run: cargo check --all-targets --verbose

      - name: Test
        run: cargo test --verbose

      - name: Core vectors
        run: cargo run --release -- --vector vectors/clc-a-core-vectors.json

      - name: Property cases
        run: cargo run --release -- --properties vectors/property-cases.json

      - name: Crosswalk vectors
        run: cargo run --release -- --crosswalk vectors/clc-d-crosswalk-vectors.json

      - name: Cleanroom leash
        shell: bash
        run: |
          set -euo pipefail
          grep -F -q '#![forbid(unsafe_code)]' src/lib.rs
          grep -F -q '#![forbid(unsafe_code)]' src/main.rs
          python3 - <<'PY'
          import pathlib
          import sys

          needles = [
              bytes.fromhex("454d494c4941").decode(),
              bytes.fromhex("47696761436c6f7564").decode(),
              bytes.fromhex("496d616e").decode(),
          ]
          roots = [
              pathlib.Path("src"),
              pathlib.Path("docs"),
              pathlib.Path("vectors"),
              pathlib.Path(".github"),
              pathlib.Path("README.md"),
              pathlib.Path("Cargo.toml"),
              pathlib.Path("rust-toolchain.toml"),
          ]
          suffixes = {".rs", ".md", ".yml", ".yaml", ".toml", ".json"}
          files = []
          parent_ci = pathlib.Path("../../.github/workflows/ci.yml")
          if parent_ci.is_file():
              files.append(parent_ci)
          for root in roots:
              if root.is_file():
                  files.append(root)
              elif root.is_dir():
                  for path in root.rglob("*"):
                      if path.is_file() and "target" not in path.parts:
                          files.append(path)
          hits = []
          for path in files:
              if path.name.startswith("GROK_HANDOFF"):
                  continue
              if path.suffix.lower() not in suffixes:
                  continue
              text = path.read_text(encoding="utf-8")
              folded = text.casefold()
              for needle in needles:
                  if needle.casefold() in folded:
                      hits.append(str(path))
                      break
          if hits:
              print("cleanroom leash: forbidden vendor string")
              for hit in hits:
                  print(hit)
              sys.exit(1)
          print("cleanroom leash: forbid(unsafe_code) present; vendor strings absent")
          PY
